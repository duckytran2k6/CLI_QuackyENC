name: Package QuackyENC for All Platforms

on:
  push:
    tags:
      - '*.*.*'

jobs:
  package-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Java 23
        uses: actions/setup-java@v4
        with:
          distribution: oracle
          java-version: '23'
      - name: Build with Maven
        run: mvn clean package
      - name: Package with jpackage (Windows)
        run: |
          jpackage --type exe --input target  --dest output  --name QuackyENC  --main-jar quackyenc-final.jar --main-class com.duckycryptography.cli.RootCommand --vendor "Vuong Tran" --app-version v${{ github.ref_name }} --win-console --description "CLI multi text file encryption tool"
      - uses: softprops/action-gh-release@v1
        with:
          files: output/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  package-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Java 23
        uses: actions/setup-java@v4
        with:
          distribution: oracle
          java-version: '23'
      - name: Build with Maven
        run: mvn clean package
      - name: Package with jpackage (macOS)
        run: |
          jpackage --type dmg \
                   --input target \
                   --dest output \
                   --name QuackyENC \
                   --main-jar quackyenc-final.jar \
                   --main-class com.duckycryptography.cli.RootCommand \
                   --vendor "Vuong Tran" \
                   --app-version ${{ github.ref_name }} \
                   --description "CLI multi text file encryption tool"
      - uses: softprops/action-gh-release@v1
        with:
          files: output/*.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  package-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Java 23
        uses: actions/setup-java@v4
        with:
          distribution: oracle
          java-version: '23'
      - name: Build with Maven
        run: mvn clean package
      - name: Package with jpackage (Linux)
        run: |
          jpackage --type deb \
                   --input target \
                   --dest output \
                   --name QuackyENC \
                   --main-jar quackyenc-final.jar \
                   --main-class com.duckycryptography.cli.RootCommand \
                   --vendor "Vuong Tran" \
                   --app-version ${{ github.ref_name }} \
                   --description "CLI multi text file encryption tool"
      - uses: softprops/action-gh-release@v1
        with:
          files: output/*.deb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
